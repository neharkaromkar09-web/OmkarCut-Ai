name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate CutsZoom AI Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36"

      - name: Ensure Gradle Wrapper is Executable
        run: chmod +x gradlew

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Check Gradle & Java Environment
        run: ./gradlew --version

      - name: Clean Build Cache
        run: ./gradlew clean

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Find, Validate & Stage Debug APK
        run: |
          set -e
          echo "Searching for generated APK files..."
          APK_FILE=$(find . -name "*.apk" -not -path "*/intermediates/*" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No generated APK found anywhere in the build tree!"
            exit 1
          fi

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Found target '$APK_FILE' is not a regular file!"
            exit 1
          fi

          if [ ! -s "$APK_FILE" ]; then
            echo "ERROR: Generated APK file '$APK_FILE' is empty (0 bytes)!"
            exit 1
          fi

          echo "Found APK at: $APK_FILE"
          FILE_SIZE_BYTES=$(stat -c%s "$APK_FILE")
          FILE_SIZE_HUMAN=$(numfmt --to=iec-i --suffix=B "$FILE_SIZE_BYTES" 2>/dev/null || echo "${FILE_SIZE_BYTES} bytes")

          echo "APK Size: $FILE_SIZE_BYTES bytes ($FILE_SIZE_HUMAN)"

          # Validate APK structure and application ID using apkanalyzer if available
          if command -v apkanalyzer >/dev/null 2>&1; then
            echo "Validating APK structure using apkanalyzer..."
            APP_ID=$(apkanalyzer manifest application-id "$APK_FILE")
            echo "Application ID verified: $APP_ID"
            if [ "$APP_ID" != "com.aistudio.cutszoom.ai" ]; then
              echo "ERROR: Invalid Application ID found: $APP_ID (expected com.aistudio.cutszoom.ai)"
              exit 1
            fi
            apkanalyzer apk summary "$APK_FILE"
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK_FILE"
            "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" apk summary "$APK_FILE"
          else
            echo "Verifying zip archive integrity..."
            unzip -tq "$APK_FILE"
          fi

          # Stage verified APK into clean ci-output directory
          mkdir -p ci-output
          cp "$APK_FILE" ci-output/CUTSZOOM-AI-debug.apk
          ls -lh ci-output/CUTSZOOM-AI-debug.apk

          echo "STAGED_APK_PATH=ci-output/CUTSZOOM-AI-debug.apk" >> $GITHUB_ENV
          echo "APK_SIZE_HUMAN=$FILE_SIZE_HUMAN" >> $GITHUB_ENV

          # Output to GitHub Actions Step Summary
          {
            echo "========================================"
            echo "CUTSZOOM AI APK BUILD SUCCESS"
            echo "========================================"
            echo ""
            echo "APK:"
            echo "CUTSZOOM-AI-debug.apk"
            echo ""
            echo "SIZE:"
            echo "$FILE_SIZE_HUMAN"
            echo ""
            echo "ARTIFACT:"
            echo "cutszoom-ai-debug-apk"
            echo ""
            echo "DOWNLOAD:"
            echo "GitHub Actions → Artifacts → cutszoom-ai-debug-apk"
            echo ""
            echo "========================================"
          } >> $GITHUB_STEP_SUMMARY

          # Print to job console
          echo "========================================"
          echo "CUTSZOOM AI APK BUILD SUCCESS"
          echo "========================================"
          echo ""
          echo "APK:"
          echo "CUTSZOOM-AI-debug.apk"
          echo ""
          echo "SIZE:"
          echo "$FILE_SIZE_HUMAN"
          echo ""
          echo "ARTIFACT:"
          echo "cutszoom-ai-debug-apk"
          echo ""
          echo "DOWNLOAD:"
          echo "GitHub Actions → Artifacts → cutszoom-ai-debug-apk"
          echo ""
          echo "========================================"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutszoom-ai-debug-apk
          path: ci-output/CUTSZOOM-AI-debug.apk
          if-no-files-found: error
          retention-days: 14
